name: Update albert-bin

on:
  schedule:
    - cron: '0 6 * * *'   # daily, 06:00 UTC — adjust as you like
  workflow_dispatch: {}     # lets you trigger it manually too

permissions:
  contents: write

jobs:
  check-and-build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
    outputs:
      up_to_date: ${{ steps.check.outputs.up_to_date }}
    steps:
      - uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git curl jq cmake \
            hicolor-icon-theme qcoro qt6-5compat qt6-declarative \
            qt6-scxml qt6-shadertools qt6-svg qtkeychain-qt6 qt6-tools \
            libqalculate pybind11 python libarchive

      - name: Get latest albert release tag
        id: latest
        run: |
          latest_tag=$(curl -s -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/albertlauncher/albert/releases/latest | jq -r .tag_name)
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "ver=${latest_tag#v}" >> "$GITHUB_OUTPUT"

      - name: Compare against current pkgver
        id: check
        run: |
          current=$(grep -Po '(?<=^pkgver=).*' PKGBUILD)
          echo "current=$current, latest=${{ steps.latest.outputs.ver }}"
          if [ "$current" = "${{ steps.latest.outputs.ver }}" ]; then
            echo "up_to_date=true" >> "$GITHUB_OUTPUT"
          else
            echo "up_to_date=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Create unprivileged build user
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder "$GITHUB_WORKSPACE"

      - name: Build binary package from source
        if: steps.check.outputs.up_to_date == 'false'
        run: |
          mkdir -p /tmp/build && cd /tmp/build
          ver="${{ steps.latest.outputs.ver }}"

          {
            echo "pkgname=albert"
            echo "pkgver=${ver}"
            echo "pkgrel=1"
            echo 'pkgdesc="A sophisticated standalone keyboard launcher"'
            echo "arch=('x86_64')"
            echo 'url="https://github.com/albertlauncher"'
            echo "license=('custom')"
            echo "depends=('hicolor-icon-theme' 'qcoro' 'qt6-5compat' 'qt6-declarative' 'qt6-scxml' 'qt6-shadertools' 'qt6-svg' 'qtkeychain-qt6')"
            echo "makedepends=('cmake' 'git' 'libqalculate' 'pybind11' 'python' 'qt6-tools')"
            echo "optdepends=('libarchive: documentation plugin' 'libqalculate: calculator plugin' 'python: python extension')"
            echo "options=('!debug')"
            echo 'source=("https://github.com/albertlauncher/albert/releases/download/v${pkgver}/v${pkgver}.tar.gz")'
            echo ""
            echo "build() {"
            echo "  mkdir -p build"
            echo "  cd build"
            echo ""
            echo "  cmake \\"
            echo "    -DCMAKE_BUILD_TYPE=MinSizeRel \\"
            echo "    -DCMAKE_INSTALL_PREFIX=/usr \\"
            echo "    -DCMAKE_INSTALL_LIBDIR=lib \\"
            echo "    -DCMAKE_FIND_PACKAGE_RESOLVE_SYMLINKS=ON \\"
            echo "    -DQHOTKEY_INSTALL=OFF \\"
            echo "    -DBUILD_PLUGIN_DEBUG=OFF \\"
            echo '    ../$pkgname'
            echo ""
            echo "  make"
            echo "}"
            echo ""
            echo "package() {"
            echo "  cd build"
            echo ""
            echo '  make DESTDIR="$pkgdir" install'
            echo '  install -Dm644 "$srcdir/$pkgname/LICENSE.md" "$pkgdir/usr/share/licenses/$pkgname/LICENSE"'
            echo "}"
            echo ""
            echo "sha512sums=('SKIP')"
          } > PKGBUILD

          chown -R builder:builder /tmp/build
          # sha512sums is SKIP since the hash changes every release and
          # we're already trusting GitHub's own source at this point
          su builder -c "cd /tmp/build && makepkg -s --noconfirm --skippgpcheck"

      - name: Upload artifact for next job
        if: steps.check.outputs.up_to_date == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: albert-pkg
          path: /tmp/build/*.pkg.tar.zst

    # up_to_date output above is read by the publish job

  publish:
    needs: check-and-build
    if: needs.check-and-build.outputs.up_to_date == 'false'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: albert-pkg
          path: dist

      - name: Compute release variables
        id: vars
        run: |
          latest_tag=$(curl -s https://api.github.com/repos/albertlauncher/albert/releases/latest | jq -r .tag_name)
          echo "tag=$latest_tag" >> "$GITHUB_OUTPUT"
          echo "ver=${latest_tag#v}" >> "$GITHUB_OUTPUT"
          echo "pkgfile=$(ls dist/*.pkg.tar.zst | xargs basename)" >> "$GITHUB_OUTPUT"

      - name: Create GitHub release with the built package
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.vars.outputs.ver }}
          files: dist/*.pkg.tar.zst

      - name: Update PKGBUILD
        run: |
          ver="${{ steps.vars.outputs.ver }}"
          pkgfile="${{ steps.vars.outputs.pkgfile }}"
          sha256=$(sha256sum "dist/$pkgfile" | awk '{print $1}')
          url="https://github.com/${{ github.repository }}/releases/download/v${ver}/${pkgfile}"

          sed -i "s|^pkgver=.*|pkgver=${ver}|" PKGBUILD
          sed -i "s|^pkgrel=.*|pkgrel=1|" PKGBUILD
          sed -i "s|^source=(.*)|source=(\"${url}\")|" PKGBUILD
          sed -i "s|^sha256sums=(.*)|sha256sums=('${sha256}')|" PKGBUILD

      - name: Regenerate .SRCINFO
        run: |
          docker run --rm -v "$PWD:/pkg" -w /pkg archlinux:base-devel \
            bash -c "pacman -Sy --noconfirm --needed pacman-contrib >/dev/null; \
                     useradd -m b && chown -R b /pkg && \
                     su b -c 'makepkg --printsrcinfo' > .SRCINFO"

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add PKGBUILD .SRCINFO
          git commit -m "Update to v${{ steps.vars.outputs.ver }}" || echo "nothing to commit"
          git push

      - name: Publish to AUR
        uses: KSXGithub/github-actions-deploy-aur@v4
        with:
          pkgname: albert-bin
          pkgbuild: ./PKGBUILD
          commit_username: "Vijay Pedagadi"
          commit_email: vijayv996@outlook.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: "Update to v${{ steps.vars.outputs.ver }}"
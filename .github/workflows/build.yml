name: Build and Release Albert Binary

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch:     # Can also be triggered manually

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest

    steps:
      - name: Fetch Latest Albert Version
        id: get_version
        run: |
          pacman -Syu --noconfirm curl jq
          # Gets tag name like "v35.1.0" and strips the "v" to leave "35.1.0"
          LATEST_TAG=$(curl -s https://api.github.com/repos/albertlauncher/albert/releases/latest | jq -r '.tag_name' | sed 's/^v//')
          echo "VERSION=$LATEST_TAG" >> $GITHUB_OUTPUT

      - name: Install Build Dependencies
        run: |
          pacman -Syu --noconfirm base-devel git cmake ninja qt6-base qt6-declarative qt6-svg qt6-scxml qt6-5compat qt6-tools qt6-shadertools qtkeychain-qt6 libqalculate python pybind11 qcoro-qt6 wget

      - name: Setup Build Environment
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          
          # Clean build space
          mkdir -p /tmp/build /tmp/pkg
          cd /tmp/build
          
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          wget https://github.com/albertlauncher/albert/releases/download/v${VERSION}/v${VERSION}.tar.gz
          tar -xzf v${VERSION}.tar.gz
          
          # Give builder permissions
          chown -R builder:builder /tmp/build /tmp/pkg

      - name: Compile Albert Binary
        run: |
          # Finds the extracted source folder automatically
          SRC_DIR=$(find /tmp/build -maxdepth 1 -mindepth 1 -type d | head -n 1)
          
          su builder -c "
            cd $SRC_DIR
            mkdir -p build && cd build
            cmake \
              -DCMAKE_BUILD_TYPE=MinSizeRel \
              -DCMAKE_INSTALL_PREFIX=/usr \
              -DCMAKE_INSTALL_LIBDIR=lib \
              -DCMAKE_FIND_PACKAGE_RESOLVE_SYMLINKS=ON \
              -DQHOTKEY_INSTALL=OFF \
              -DBUILD_PLUGIN_DEBUG=OFF \
              ..
            
            make -j$(nproc)
            make DESTDIR=/tmp/pkg install
          "

      - name: Create Arch Linux Binary Package (.pkg.tar.zst)
        run: |
          VERSION="${{ steps.get_version.outputs.VERSION }}"
          cd /tmp/pkg
          
          # Generate .PKGINFO metadata for Arch Linux package manager
          cat << EOF > .PKGINFO
          pkgname = albert-bin
          pkgver = ${VERSION}-1
          pkgdesc = A sophisticated standalone keyboard launcher. Binary version.
          url = https://albertlauncher.github.io/
          builddate = $(date +%s)
          packager = Vijay Pedagadi <vijayv996@outlook.com>
          size = $(du -sb . | cut -f1)
          arch = x86_64
          license = custom
          depend = hicolor-icon-theme
          depend = qcoro
          depend = qt6-5compat
          depend = qt6-declarative
          depend = qt6-scxml
          depend = qt6-shadertools
          depend = qt6-svg
          depend = qtkeychain-qt6
          EOF

          # Package into Arch .tar.zst format
          tar --gno -cnvf - * .PKGINFO | bsdtar -czf /tmp/albert-bin-${VERSION}-1-x86_64.pkg.tar.zst --format=gnutar -@ -

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: v${{ steps.get_version.outputs.VERSION }}
          name: Albert Binary v${{ steps.get_version.outputs.VERSION }}
          files: /tmp/albert-bin-${{ steps.get_version.outputs.VERSION }}-1-x86_64.pkg.tar.zst
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}